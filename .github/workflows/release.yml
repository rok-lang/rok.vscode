# On a vX.Y.Z tag: package the .vsix, publish it to the VS Code
# Marketplace and Open VSX through trusted publishing, attach it to a GitHub
# release. Open VSX takes OVSX_PAT instead while that secret is set. Run by hand with a tag to finish a release that
# stopped halfway; a version already published is skipped.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: tag matches package.json
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "v$v" != "$TAG" ]; then
            echo "tag $TAG, package.json $v: bump package.json or retag" >&2
            exit 1
          fi
          echo "VSIX=rok-$v.vsix" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run compile
      - run: node scripts/sync-grammar.mjs --check
      - run: npm run package -- --out "$VSIX"
      - run: npx vsce ls

      - name: publish to the VS Code Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --skip-duplicate "$VSIX"

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/rok-lang/rok.vscode/blob/$TAG/CHANGELOG.md)."
          fi
