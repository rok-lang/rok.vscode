# On a vX.Y.Z tag: package the .vsix, publish it to the VS Code
# Marketplace (trusted publishing, no secret) and Open VSX (OVSX_PAT),
# attach it to a GitHub release. Open VSX is skipped while OVSX_PAT is unset.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: tag matches package.json
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, package.json $v: bump package.json or retag" >&2
            exit 1
          fi
          echo "VSIX=rok-$v.vsix" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run compile
      - run: node scripts/sync-grammar.mjs --check
      - run: npm run package -- --out "$VSIX"
      - run: npx vsce ls

      - name: publish to the VS Code Marketplace
        run: npx vsce publish --oidc --packagePath "$VSIX"

      - name: publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "$VSIX"

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/rok-lang/rok.vscode/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
