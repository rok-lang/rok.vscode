# syntaxes/ must be rok-syntax's grammars at the commit in rok-syntax.rev.
name: grammar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-grammar.mjs --check
