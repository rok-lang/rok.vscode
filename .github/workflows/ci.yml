name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # syntaxes/ must be rok-syntax's grammars at the commit in rok-syntax.rev.
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-grammar.mjs --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package
      - run: npx vsce ls
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
